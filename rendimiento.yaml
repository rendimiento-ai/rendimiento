# rendimiento builds itself. Every push to main rebuilds its book (docs,
# public in English and Spanish, and on the home network) and tests and builds its own image (builds:
# platform), so a change is checked on the cluster like any app's. The
# image is kept with the release; it is not deployed from here yet.
services:
  - name: docs
    path: .
    build:
      builder: dockerfile
      dockerfile: docs/Dockerfile
    port: 8080
    size: small
    replicas: 1
    health: { path: / }
    # The public book; aprende. opens the Spanish edition (docs/nginx.conf).
    domain: learn.rendimiento.ai
    aliases: [aprende.rendimiento.ai]
    # A LAN address from MetalLB's pool (any free one): the home-network
    # edition of the book, with private pages, is served from main_configs.
    lan: {}
    catalog:
      category: devtools
      title: rendimiento book
      description: How rendimiento works, how it is deployed here, and how to change it.
builds:
  # rendimiento's own image: the Go tests (envtest and a throwaway Postgres)
  # first, then the Dockerfile, which also checks the UI. The API's and the
  # platform's tests, the longest, are tasks of their own below, so they run
  # at once on other nodes; this step has the checks and everything else.
  - name: platform
    path: .
    build: { dockerfile: Dockerfile }
    test:
      image: golang:1.27
      command: CI_PARTE=resto CHECK_GENERATED=1 hack/ci-test.sh
      postgres: true
      cache: true
      # An envtest API server runs beside the other packages: with less
      # than two cores, etcd timed out (run 881, at 1.5). Where steps do not
      # fit, the Environment page's Capacity lowers what steps reserve, or
      # turns nodes off.
      resources: { cpu: "2", memory: 2Gi, memoryLimit: 5Gi }
tasks:
  # The API's and the platform's Go tests (hack/ci-test.sh, CI_PARTE), each
  # with its own Postgres and one envtest, beside platform:test: in one step
  # they shared a database and ran one after the other (about 7 minutes).
  - name: pruebas-api
    image: golang:1.27
    command: CI_PARTE=api hack/ci-test.sh
    when: always
    watch: [internal, api, cmd, web/embed.go, hack/ci-test.sh, go.mod, go.sum]
    postgres: true
    cache: true
    resources: { cpu: "1", cpuLimit: "2", memory: 2Gi, memoryLimit: 4Gi }
  - name: pruebas-plataforma
    image: golang:1.27
    command: CI_PARTE=plataforma hack/ci-test.sh
    when: always
    watch: [internal, api, cmd, web/embed.go, hack/ci-test.sh, go.mod, go.sum]
    postgres: true
    cache: true
    resources: { cpu: "1", cpuLimit: "2", memory: 2Gi, memoryLimit: 4Gi }
  # The UI in a browser (Playwright), on every push: the real API and the
  # built UI on an empty database, with a fake GitHub serving every example
  # of internal/spec/ejemplos, walked through "New app" and every page
  # (web/e2e, hack/ci-interfaz.sh).
  - name: interfaz-en
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    command: PROYECTO=en hack/ci-interfaz.sh
    when: always
    watch: [web, internal, api, hack/interfaz, hack/ci-interfaz.sh, go.mod, go.sum]
    postgres: true
    cache: true
    # Chromium, the test server and Postgres share it: with one core they
    # starved when the cluster was busy and waits ran out (runs 1263, 1275
    # and 1276 of 12-13 Nov failed so, never on the code).
    # Its size's CPU limit is 1: the request needs a limit of its own.
    resources: { cpu: "2", cpuLimit: "3", memory: 1Gi, memoryLimit: 3Gi }
  - name: interfaz-es
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    command: PROYECTO=es hack/ci-interfaz.sh
    when: always
    watch: [web, internal, api, hack/interfaz, hack/ci-interfaz.sh, go.mod, go.sum]
    postgres: true
    cache: true
    # Chromium, the test server and Postgres share it: with one core they
    # starved when the cluster was busy and waits ran out (runs 1263, 1275
    # and 1276 of 12-13 Nov failed so, never on the code).
    # Its size's CPU limit is 1: the request needs a limit of its own.
    resources: { cpu: "2", cpuLimit: "3", memory: 1Gi, memoryLimit: 3Gi }
