# A shop whose copies read their own secrets: every secret it names (whole,
# by key, as files, and its tests' by key) has a preview variant beside it,
# pagos-preview for pagos, which each copy gets as pagos. Production's
# values never reach a copy; without a -preview the copy has no such secret.
services:
  - name: web
    port: 3000
    domain: tienda.example.com
    secrets: [pagos]
    secretEnv:
      MAIL_KEY: correo/key
    secretFiles:
      - secret: certificados
        mount: /etc/certificados
builds:
  - name: e2e
    path: e2e
tests:
  build: e2e
  secretEnv:
    TEST_PASSWORD: usuario-prueba/password
previews: {}
