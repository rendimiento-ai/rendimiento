# Publishes the rendimiento program for Linux (amd64 and arm64) with each
# v* tag, as a GitHub release with its SHA256SUMS: what the installer
# (curl -fsSL https://rendimiento.ai/instalar | sh) downloads. Two things
# for Windows go with it, in the same SHA256SUMS: the WSL distribution
# (instalar/wsl) and rendimiento for Windows (escritorio/, a Go module of
# its own; not signed yet), the app that downloads that distribution,
# checks it against SHA256SUMS and imports it. The Helm
# chart goes with it, its version and appVersion set to the tag's (so it
# installs that release's image), attached to the release and pushed to
# oci://ghcr.io/rendimiento-ai/charts. rendimiento tested the change before
# it was merged; this only builds and publishes.
name: binarios

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The UI, embedded in the program
        run: cd web && npm ci && npm run build
      - name: The program, for each processor
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o dist/rendimiento-linux-$arch ./cmd/rendimiento
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: The WSL distribution, for Windows
        run: |
          cp dist/rendimiento-linux-amd64 instalar/wsl/
          docker buildx build --platform linux/amd64 --output type=tar,dest=dist/rendimiento-wsl-amd64.tar instalar/wsl
          gzip -9 dist/rendimiento-wsl-amd64.tar
      # Built from Linux with plain go build, as hack/ci-test.sh does on
      # every push: Wails' tags for a release, and no console window.
      - name: rendimiento for Windows
        run: |
          cd escritorio
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags desktop,production -trimpath -ldflags="-s -w -H windowsgui -X main.version=${GITHUB_REF_NAME#v}" -o ../dist/rendimiento-windows-amd64.exe .
      # The only place that writes it: the installer looks its program up
      # here, and the Windows app the distribution.
      - name: SHA256SUMS, of all of them
        run: cd dist && sha256sum rendimiento-linux-* rendimiento-wsl-* rendimiento-windows-* > SHA256SUMS
      - name: The Helm chart, with this release's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=${GITHUB_REF_NAME#v}
          helm package chart/rendimiento --version "$version" --app-version "$version" -d dist
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/rendimiento-$version.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/rendimiento-linux-amd64
            dist/rendimiento-linux-arm64
            dist/SHA256SUMS
            dist/rendimiento-wsl-amd64.tar.gz
            dist/rendimiento-windows-amd64.exe
            dist/rendimiento-*.tgz
          generate_release_notes: true

  # After a release: the changelog's "Unreleased" becomes that release, with
  # its date, in a pull request to main that a person merges (nothing is
  # pushed to main). It needs "Allow GitHub Actions to create and approve
  # pull requests" in the organization's or repository's Actions settings.
  changelog:
    needs: publicar
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: The changelog, for this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$GITHUB_REF_NAME
          grep -q "^## $tag " CHANGELOG.md && { echo "already there"; exit 0; }
          grep -q '^## Unreleased' CHANGELOG.md || { echo "no Unreleased section"; exit 0; }
          awk -v t="$tag" -v d="$(date -u +%F)" '!done && /^## Unreleased/ { print; print ""; print "## " t " (" d ")"; done = 1; next } { print }' CHANGELOG.md >CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          branch="changelog-$tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "CHANGELOG: $tag"
          git push -q origin "$branch"
          # Without the permission to open pull requests, the branch is
          # there all the same: the run stays green and says where to open it.
          if ! gh pr create --base main --head "$branch" --title "CHANGELOG: $tag" \
            --body "What was under Unreleased is now $tag, released today. Merge it so the changelog matches the release."; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch"
            echo "::warning::Could not open the changelog's pull request (allow GitHub Actions to create pull requests in Settings → Actions → General). Open it by hand: $url"
            printf '### The changelog for %s\n\nThe branch `%s` has it. Open its pull request by hand: %s\n' "$tag" "$branch" "$url" >>"$GITHUB_STEP_SUMMARY"
          fi
