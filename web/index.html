    <script>
      // The day/night theme, the colors and movement chosen in the top bar,
      // applied before the first paint so the page never flashes the other
      // theme. The families are those in components/ambiente.tsx.
      try {
        var t = localStorage.getItem("rendimiento.tema");
        if (t === "day" || t === "night") document.documentElement.dataset.theme = t;
        var c = localStorage.getItem("rendimiento.colores");
        if (["sierra", "atardecer", "bugambilia", "talavera", "milpa", "adobe"].indexOf(c) >= 0) document.documentElement.dataset.tema = c;
        if (localStorage.getItem("rendimiento.movimiento") === "off") document.documentElement.dataset.motion = "off";
      } catch (e) {}
    </script>
    <title>rendimiento.ai</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
